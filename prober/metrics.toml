# Metric definitions are DATA, not code. Adding one that fits an existing
# probe kind needs no Rust change. Each is emitted as a dqv:Metric so the
# definitions are published, not private config.

[[metric]]
id = "availability"
label = "Answers a trivial query"
dimension = "availability"
kind = "Liveness"
cost = "cheap"
cadence = "hourly"
query = "SELECT ?s WHERE { ?s ?p ?o } LIMIT 1"

# Two CORS facts, deliberately separate. `cors` is what a curl user sees: an
# access-control-allow-origin header on a simple GET. `cors-preflight` is what a
# browser sees, and it decides whether the embedded editor can talk to this
# endpoint at all. An endpoint can genuinely have one and not the other, so
# neither subsumes the other.
[[metric]]
id = "cors"
label = "Sends access-control-allow-origin on a simple GET"
dimension = "interoperability"
kind = "Cors"
cost = "cheap"
cadence = "hourly"
query = "SELECT ?s WHERE { ?s ?p ?o } LIMIT 1"

[[metric]]
id = "cors-preflight"
label = "Answers a CORS preflight for a cross-origin GET"
dimension = "interoperability"
kind = "CorsPreflight"
cost = "cheap"
cadence = "hourly"

[[metric]]
id = "geo-coordinates"
label = "Holds WGS84 coordinates"
dimension = "content"
kind = "AskData"
var = "lat"
cost = "cheap"
query = """
PREFIX wgs84: <http://www.w3.org/2003/01/geo/wgs84_pos#>
SELECT ?lat WHERE { { ?s wgs84:lat ?lat } UNION { GRAPH ?anyg { ?s wgs84:lat ?lat } } } LIMIT 1
"""
# COORDINATES ARE NOT GEOMETRY, and that is why this is a metric of its own
# rather than a widening of `geo-data`.
#
# `geo-data` asks for `geo:asWKT`, and WKT is what the `geof:` functions
# operate on. A bare `wgs84:lat` is not: measured against this project's own
# endpoint on 2026-09-26, `geof:sfWithin("50.84833"^^xsd:decimal, <polygon>)`
# returns FALSE -- not an error, which is the dangerous kind of wrong. The same
# point promoted to `"POINT(5.68889 50.84833)"^^geo:wktLiteral` returns true.
# So an endpoint holding lat/long has location data that no spatial function
# will touch until somebody builds geometry out of it, and a consumer asking
# "can I do spatial queries here" needs those two facts apart.
#
# Widening `geo-data` instead would have made its own label -- "Holds WKT
# geometry" -- false, and would have changed what every historical `absent`
# meant.
#
# WHAT THIS FIXES. Until this existed, an endpoint holding every coordinate it
# owns as `wgs84:lat`/`wgs84:long` read `geo-data: absent`: a confident wrong
# answer about an endpoint full of exactly the content we said it lacked, which
# is the failure this whole project is arranged against. Sampled on 2026-09-26,
# none of twelve answering endpoints in the current registry hold `wgs84:lat`,
# so this changes nothing today -- but the seeded LOD Cloud registry carries at
# least thirteen plainly geographic endpoints, LinkedGeoData among them, and
# LinkedGeoData publishes coordinates exactly this way.
#
# `?anyg`, never `?lat`. `GRAPH ?lat { ?s wgs84:lat ?lat }` would join the
# graph name against the coordinate and publish a silent false `absent`. Same
# trap as `geo-data`'s, written out again because it is one edit away.
fallback_query = """
PREFIX wgs84: <http://www.w3.org/2003/01/geo/wgs84_pos#>
SELECT ?lat WHERE { ?s wgs84:lat ?lat } LIMIT 1
"""

[[metric]]
id = "geo-functions"
label = "GeoSPARQL relation functions"
dimension = "capability"
kind = "AskFilter"
cost = "cheap"
expect = true
query = """
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
ASK { FILTER(geof:sfWithin("POINT(5 52)"^^geo:wktLiteral, "POLYGON((0 50,10 50,10 55,0 55,0 50))"^^geo:wktLiteral)) }
"""
# In the survey behind this project, 0 of 28 endpoints publishing a service
# description declared anything geospatial, while 18 demonstrably evaluated
# geof:sfWithin. This field is expected to change almost nothing. It exists so
# that the rare honest endpoint is credited, not because we expect it to fire often.
declared_by = "http://www.opengis.net/def/function/geosparql/sfWithin"

# Both queries look in the default graph AND in named graphs. Default-graph-only
# versions published `absent` for an endpoint holding everything in named
# graphs, a confident wrong answer about an endpoint full of exactly the content
# we said it lacked. The UNION costs more on a large endpoint, which is what the
# cost class in stage 1c-b is for.
#
# Measured on qlever.dev/api/osm-planet (planet-scale OSM) on 2026-08-21, cold:
# the DEFAULT-GRAPH-ONLY `classes` query took 36.9s and a repeat exceeded 40s,
# while the UNION exceeded 40s and then 60s. So on an endpoint this size neither
# shape fits the 30s request budget and the metric reads `indeterminate`, which
# is honest but uninformative. Note what that means: the cost is inherent to
# `SELECT DISTINCT ?c WHERE { ?s a ?c }` needing a scan over every type, not to
# the UNION, so a cost class alone will not make this measurable. Rethinking the
# query shape for large endpoints belongs with the cost class in 1c-b.
#
# The graph variable is ?anyg, never the result variable. `GRAPH ?g { ?s
# geo:asWKT ?g }` would join the graph name against the geometry literal, match
# nothing, and publish a silent false `absent`.
[[metric]]
id = "geo-data"
label = "Holds WKT geometry"
dimension = "content"
kind = "AskData"
var = "g"
cost = "cheap"
query = """
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
SELECT ?g WHERE { { ?s geo:asWKT ?g } UNION { GRAPH ?anyg { ?s geo:asWKT ?g } } } LIMIT 1
"""
# THE UNION IS NOT UNIVERSALLY SUPPORTED, and before 2026-09-18 that read as
# `indeterminate` rather than as an answer. Three of the 63 YummyData endpoints
# -- sparql.dsmz.de's bacdive, brenda and mediadive -- answer the query below
# and refuse the one above with
#
#   HTTP 400 "Not supported: Named Graphs (FROM, GRAPH) are currently not
#   supported"
#
# so the whole query was rejected for a construct they do not implement, and
# the half of it they could have answered was never asked. Wikidata refuses it
# too. That was 4 of 58 reachable endpoints on that sweep reporting "we could
# not tell" when the truth was "we asked badly".
#
# Tried only after a 4xx, so an endpoint that answers the UNION is asked once.
# An empty answer HERE is an honest `absent`: a store that rejects GRAPH as
# unsupported has no named graphs for geometry to hide in, so the default graph
# is the whole store. See MetricDef::fallback_query.
fallback_query = """
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
SELECT ?g WHERE { ?s geo:asWKT ?g } LIMIT 1
"""

[[metric]]
id = "service-description"
label = "Service description informativeness"
dimension = "documentation"
kind = "FetchWellKnown"
cost = "cheap"
cadence = "hourly"
graded = true

# `classes` and `has-classes` were both retired here, and the questions they
# were reaching for are answered by the content pass below.
#
# `has-classes` went on 2026-08-28. It asked whether anything typed existed at
# all, and as a CONTENT fact "something here is typed" is close to worthless:
# every RDF dataset worth monitoring has types, and 54 verified against 489
# indeterminate on the 2026-08-24 sweep says it was mostly reporting whether a
# query came back. `availability` asks that with a smaller query.
#
# `classes` went on 2026-09-04, as a VERDICT. Its query survives as the content
# pass's first step, which is Ruling 4 in
# docs/superpowers/specs/2026-08-29-content-profiles-design.md and its
# sequencing note: retiring it before the pass could replace it would have
# bought a tidier matrix and lost the only content sampling the prober can do.
# It never produced a verdict, not once, across 597 mentions in all four
# preserved runs: it is `expensive` and every sweep so far ran at the `cheap`
# ceiling, so all 597 are declines. A `verified` would have meant "we
# enumerated some classes", one step along from the worthless fact that retired
# `has-classes`. The value was always the ContentSample, never the verdict.
#
# Retiring it also ended a real cost: while both shipped, a sweep sent the same
# DISTINCT ?c enumeration to every endpoint TWICE, once for each metric.
#
# THE MEASUREMENTS BOTH PUBLISHED STAND. A run graph records what one sweep
# observed and nothing here rewrites one, so the web tier still derives their
# columns from the store and still describes them, marked as no longer
# measured. See web/app.py's METRIC_DOCS, and CLASS_SAMPLING_METRICS in
# web/endpoint_content.py for how a `classes` sample is still read.

# The content pass. Enumerates this endpoint's classes, then profiles each one:
# which properties its instances carry and how many carry each.
#
# NO VERDICT, and that is the point rather than an omission. A profile is an
# inference from a sample and the six-verdict vocabulary is for what was
# observed, so this metric publishes `ContentSample` and `ContentProfile` facts
# and no measurement row at all. It therefore has no column in the index's
# matrix, which is what Ruling 2 and Ruling 4 in
# docs/superpowers/specs/2026-08-29-content-profiles-design.md decide.
#
# The query below is the CLASS ENUMERATION, and it is the same question the
# `classes` metric asks above. Once this ships, Ruling 4's sequencing note
# applies: `classes` loses its verdict in the same change, not before, because
# retiring it first would buy a tidier matrix and lose the only content sampling
# the prober can do.
#
# `expensive`, so the default `--max-cost cheap` declines it and a sweep has to
# ask for it. That is deliberate: at one query per class this is the most costly
# thing the prober does to a stranger's server.
#
# The enumeration binds `?c` in `?s a ?c`, which is an IRI, and the pass reads
# it with `select_iris`. That pairing is load-bearing and the warning is
# inherited from `classes`, which carried it after `has-classes` carried it
# first: a literal-extracting path (`Client::ask_literal`, with the literal
# guard at `client.rs:472`) finds no literal here, reports `boolean = false`,
# and would report an endpoint full of typed resources as having nothing. A
# silent false negative of exactly the kind this project exists to prevent.
#
# `sample_prefix` empty means an exact profile: every instance of every class.
# Measured 2026-08-29 over 200,000 instances, a prefix of one hex character keeps
# about a sixteenth and every property frequency landed within 0.002 of the true
# value, so "0" is the setting to reach for on an endpoint too large to profile
# exactly. There is no LIMIT option, because a LIMIT cuts by the store's own
# iteration order and was wrong by 0.950 in that same measurement.
[[metric]]
id = "class-profiles"
label = "Properties per class"
dimension = "content"
kind = "ClassProfile"
var = "c"
# EXHAUSTIVE, not expensive, and the tier is about the schedule rather than
# about how slow one query is. This metric issues one query PER CLASS it
# finds -- 199 of them against ontoexplorer, each paying the 2s per-host gap,
# which was 75% of every sweep. At `expensive` there was no way to keep the
# three counts hourly without paying for this hourly too.
cost = "exhaustive"
sample_limit = 200
sample_prefix = ""
query = """
SELECT DISTINCT ?c WHERE { { ?s a ?c } UNION { GRAPH ?anyg { ?s a ?c } } } LIMIT 200
"""

# Does this endpoint DESCRIBE the vocabulary it actually uses?
#
# The content dimension's only verdict, and the question this project exists to
# ask, applied to what an endpoint holds rather than to what it can do.
#
# IT SENDS NOTHING. Both halves are already in hand by the time it is graded:
# the classes a `void:classPartition` named, from the description fetched once
# per endpoint, and the classes the profile pass above actually found. So it is
# `cheap` in the only sense that matters to an operator being probed, and yet it
# is listed after `class-profiles` and reads `indeterminate` without it, because
# it grades that pass's results and there is nothing to grade until it has run.
#
# `declared-but-wrong` is deliberately unreachable here. It would mean the
# description named classes and the endpoint holds none of them, and this cannot
# tell that apart from a pass that reached only a subset: the enumeration is
# capped at 200 and the ladder samples, so a named class missing from the
# profiles may simply never have been asked about. The harshest verdict in the
# vocabulary is not one to hand out on that evidence.
[[metric]]
id = "vocabulary-described"
label = "Describes its own vocabulary"
dimension = "content"
kind = "VocabularyDescribed"
# EXHAUSTIVE, though it sends no request of its own, and that is the point.
# This metric grades what `class-profiles` found, so on a sweep that declined
# the profile pass it has nothing to grade. Left at `cheap` it still ran, and
# `resolve` read `indeterminate` -- correct in the narrow sense, and badly
# wrong in a history: an hourly sweep would have published "we could not
# determine it" twenty-three times a day about an endpoint nobody had asked.
#
# Tiering it with the pass it grades makes the two decline together, and
# `within_cost` already says so honestly: one NotMeasured { CostCeiling } per
# declined metric, which the page draws as "not measured" rather than as a
# verdict about the endpoint.
cost = "exhaustive"
declared_by = "http://rdfs.org/ns/void#classPartition"

# ---------------------------------------------------------------------------
# The three counts, each set against what the endpoint says about itself
# ---------------------------------------------------------------------------
#
# The DECLARED value is what this service reports for "how big is this
# endpoint". The count exists to say whether that statement is true, which is
# the only reason to spend a scan on it. So a description that states its size
# is believed, and checked whenever a sweep runs at the expensive ceiling.
#
# EVERY QUERY UNIONS THE DEFAULT AND NAMED GRAPHS, and this is not stylistic.
# Measured 2026-09-05 against ontoexplorer's content store, which holds
# 12,510,532 triples across 45 named graphs:
#
#   SELECT (COUNT(*)) WHERE { ?s ?p ?o }                              -> 0
#   SELECT (COUNT(*)) WHERE { {?s ?p ?o} UNION {GRAPH ?g {?s ?p ?o}} } -> 12,510,532
#
# Not an undercount, a flat ZERO, on a real production store, which would have
# been published as a confident fact. Named graphs are the normal arrangement
# in Virtuoso, GraphDB and Blazegraph, so the default-graph-only form is wrong
# about most real endpoints rather than about an unusual one.
#
# `tolerance = 0.05` on all three. A VoID file is written once and the dataset
# keeps growing, so exact matching would report `declared-but-wrong` -- the
# harshest verdict in the vocabulary -- for a dataset that gained a dozen
# triples since its description was published. Five percent is a judgement, not
# a measurement, and it is here rather than in code so that changing it is one
# line and a re-run.
#
# `expensive`, all three. A COUNT over the default and named graphs is a full
# scan, and on a large endpoint it is the second most costly thing this prober
# does after the profile pass.

[[metric]]
id = "triple-count"
label = "States how many triples it holds"
dimension = "content"
kind = "Counted"
var = "n"
cost = "expensive"
declared_by = "http://rdfs.org/ns/void#triples"
tolerance = 0.05
query = """
SELECT (COUNT(*) AS ?n) WHERE { { ?s ?p ?o } UNION { GRAPH ?g { ?s ?p ?o } } }
"""
# WHICH SHAPE OF DATASET IS THIS. The query above is right when the default
# graph is storage of its own and counts everything twice when it is a view
# over the named graphs, and nothing in a response says which it is. So it is
# asked. A row here means a default-graph triple also lives in a named graph.
#
# data.allie.dbcls.jp declares 335,241,279 triples; the UNION observed
# 675,397,120, a ratio of 2.015, and this project published
# `declared-but-wrong` against an honest declaration. It is Virtuoso serving a
# union default graph, confirmed with this very query on 2026-09-26.
#
# Taking the larger of the two counts was tried first and is WRONG. The
# synthetic control holds 9 triples in its default graph and 38 in named
# graphs, disjoint, ground truth 47; the larger is 38. The control exists for
# this and it caught it within the hour.
overlap_probe = """
SELECT (1 AS ?overlap) WHERE { ?s ?p ?o . GRAPH ?g { ?s ?p ?o } } LIMIT 1
"""
overlap_query = """
SELECT (COUNT(*) AS ?n) WHERE { GRAPH ?g { ?s ?p ?o } }
"""

[[metric]]
id = "graph-count"
label = "States how many graphs it holds"
dimension = "content"
kind = "Counted"
var = "n"
cost = "expensive"
# No VoID or service-description predicate states a NUMBER of graphs, so the
# claim is the length of the `sd:namedGraph` list. Keyed on that predicate
# because it is the one this metric can name; `declare.rs` counts the
# statements rather than reading a value.
declared_by = "http://www.w3.org/ns/sparql-service-description#namedGraph"
tolerance = 0.05
query = """
SELECT (COUNT(DISTINCT ?g) AS ?n) WHERE { GRAPH ?g { ?s ?p ?o } }
"""

[[metric]]
id = "class-count"
label = "States how many classes it holds"
dimension = "content"
kind = "Counted"
var = "n"
cost = "expensive"
declared_by = "http://rdfs.org/ns/void#classes"
tolerance = 0.05
query = """
SELECT (COUNT(DISTINCT ?c) AS ?n) WHERE { { ?s a ?c } UNION { GRAPH ?g { ?s a ?c } } }
"""
# Same shape question as triple-count's; see its `overlap_probe`. COUNT
# DISTINCT makes a union default graph harmless here -- the same class seen
# twice is still one class -- so this exists for the ENDPOINT that puts some
# classes only in its default graph, where the named-only count would miss
# them. The probe answers the same question either way and the choice stays
# consistent across the three counts, which is worth more than saving one
# cheap request on one metric.
overlap_probe = """
SELECT (1 AS ?overlap) WHERE { ?s ?p ?o . GRAPH ?g { ?s ?p ?o } } LIMIT 1
"""
overlap_query = """
SELECT (COUNT(DISTINCT ?c) AS ?n) WHERE { GRAPH ?g { ?s a ?c } }
"""

