# Metric definitions are DATA, not code. Adding one that fits an existing
# probe kind needs no Rust change. Each is emitted as a dqv:Metric so the
# definitions are published, not private config.

[[metric]]
id = "availability"
label = "Answers a trivial query"
dimension = "availability"
kind = "Liveness"
cost = "cheap"
query = "SELECT ?s WHERE { ?s ?p ?o } LIMIT 1"

# Two CORS facts, deliberately separate. `cors` is what a curl user sees: an
# access-control-allow-origin header on a simple GET. `cors-preflight` is what a
# browser sees, and it decides whether the embedded editor can talk to this
# endpoint at all. An endpoint can genuinely have one and not the other, so
# neither subsumes the other.
[[metric]]
id = "cors"
label = "Sends access-control-allow-origin on a simple GET"
dimension = "interoperability"
kind = "Cors"
cost = "cheap"
query = "SELECT ?s WHERE { ?s ?p ?o } LIMIT 1"

[[metric]]
id = "cors-preflight"
label = "Answers a CORS preflight for a cross-origin GET"
dimension = "interoperability"
kind = "CorsPreflight"
cost = "cheap"

[[metric]]
id = "geo-functions"
label = "GeoSPARQL relation functions"
dimension = "capability"
kind = "AskFilter"
cost = "cheap"
expect = true
query = """
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
ASK { FILTER(geof:sfWithin("POINT(5 52)"^^geo:wktLiteral, "POLYGON((0 50,10 50,10 55,0 55,0 50))"^^geo:wktLiteral)) }
"""
# In the survey behind this project, 0 of 28 endpoints publishing a service
# description declared anything geospatial, while 18 demonstrably evaluated
# geof:sfWithin. This field is expected to change almost nothing. It exists so
# that the rare honest endpoint is credited, not because we expect it to fire often.
declared_by = "http://www.opengis.net/def/function/geosparql/sfWithin"

# Both queries look in the default graph AND in named graphs. Default-graph-only
# versions published `absent` for an endpoint holding everything in named
# graphs, a confident wrong answer about an endpoint full of exactly the content
# we said it lacked. The UNION costs more on a large endpoint, which is what the
# cost class in stage 1c-b is for.
#
# Measured on qlever.dev/api/osm-planet (planet-scale OSM) on 2026-08-21, cold:
# the DEFAULT-GRAPH-ONLY `classes` query took 36.9s and a repeat exceeded 40s,
# while the UNION exceeded 40s and then 60s. So on an endpoint this size neither
# shape fits the 30s request budget and the metric reads `indeterminate`, which
# is honest but uninformative. Note what that means: the cost is inherent to
# `SELECT DISTINCT ?c WHERE { ?s a ?c }` needing a scan over every type, not to
# the UNION, so a cost class alone will not make this measurable. Rethinking the
# query shape for large endpoints belongs with the cost class in 1c-b.
#
# The graph variable is ?anyg, never the result variable. `GRAPH ?g { ?s
# geo:asWKT ?g }` would join the graph name against the geometry literal, match
# nothing, and publish a silent false `absent`.
[[metric]]
id = "geo-data"
label = "Holds WKT geometry"
dimension = "content"
kind = "AskData"
var = "g"
cost = "cheap"
query = """
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
SELECT ?g WHERE { { ?s geo:asWKT ?g } UNION { GRAPH ?anyg { ?s geo:asWKT ?g } } } LIMIT 1
"""

[[metric]]
id = "service-description"
label = "Service description informativeness"
dimension = "documentation"
kind = "FetchWellKnown"
cost = "cheap"
graded = true

# `classes` was two metrics until 2026-08-28. `has-classes` asked whether
# anything typed existed at all, with the same query minus the DISTINCT and with
# LIMIT 1, and it was cheap for the reason the split recorded: measured on
# qlever.dev/api/osm-planet the DISTINCT enumeration timed out past 45s while the
# existence probe answered in 0.166s, 270 times faster.
#
# It was removed because the question it answered is not the one it looked like.
# As a CONTENT fact "something here is typed" is close to worthless: every RDF
# dataset worth monitoring has types, and 54 verified against 489 indeterminate
# on the 2026-08-24 sweep says the metric was mostly reporting whether a query
# came back at all. That is what `availability` asks, with a smaller query, so
# the pair measured responsiveness twice and content once badly.
#
# THE 543 MEASUREMENTS IT ALREADY PUBLISHED STAND. A run graph is a record of
# what one sweep observed and nothing here rewrites one, so the web tier still
# derives a column for this metric from the store and still describes it, marked
# as no longer measured. See web/app.py's METRIC_DOCS.
[[metric]]
id = "classes"
label = "Distinct classes"
dimension = "content"
# `SelectIris`, NOT `AskData`. This warning lived on `has-classes` until that
# metric was removed on 2026-08-28, and it belongs here now because this metric
# is the same shape: `AskData` routes through `Client::ask_literal`, which
# extracts with the literal guard on (`client.rs:472`), and `?c` in `?s a ?c`
# binds an IRI. Under `AskData` the guard would find no literal, report
# `boolean = false`, and publish `absent` for an endpoint full of typed
# resources: a silent false negative of exactly the kind this project exists to
# prevent. `prober/tests/end_to_end.rs` pins it.
kind = "SelectIris"
var = "c"
cost = "expensive"
sample_limit = 200
query = """
SELECT DISTINCT ?c WHERE { { ?s a ?c } UNION { GRAPH ?anyg { ?s a ?c } } } LIMIT 200
"""
