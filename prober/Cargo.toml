[package]
name = "sparqlwatch-prober"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
# The sweeper, so a bare `cargo run` stays the sweeper now that `seed-registry`
# and `dormancy` are `[[bin]]` targets beside it. Without this key cargo refuses
# to choose, and README.md:69 and :1622 and src/bin/seed-registry.rs:11 all
# instruct a bare `cargo run`.
default-run = "sparqlwatch-prober"

[dependencies]
oxrdf = "0.3"
oxrdfio = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "query", "system-proxy"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
wiremock = "0.6"

[lib]
name = "sparqlwatch_prober"
path = "src/lib.rs"

[[bin]]
name = "sparqlwatch-prober"
path = "src/main.rs"

# The seeder. A separate binary and not a flag on the prober: it reads a dump
# nobody probes, writes files rather than a run graph, and a plain sweep must
# not be one flag away from regenerating its own registry.
[[bin]]
name = "seed-registry"
path = "src/bin/seed-registry.rs"

# The operator's override. A third binary and not a flag on the prober, for the
# reason the seeder gives above: a plain sweep must not be one flag away from
# mutating the decisions a person took. It is also the only thing that creates
# the state file, so a fresh checkout runs this once before it can sweep at all.
[[bin]]
name = "dormancy"
path = "src/bin/dormancy.rs"
