# prober/endpoints.toml
#
# The list this prober actually sweeps. Replaced 2026-09-05, from three
# third-party endpoints taken out of the LOD Cloud dump to these three, which
# are ours to probe: one we generate, two on infrastructure this project's
# operator runs. That removes the consent question the earlier list carried,
# and it is why `registry/lod-cloud.toml` and its 543 entries stay seeded but
# unswept.
#
# The synthetic endpoint is FIRST on purpose. It is the only one whose right
# answers are known, so it is the control: a metric that disagrees with it is
# wrong about the metric, not about the endpoint. Start it with
#
#     cd web && .venv/bin/python ../tools/synthetic/serve.py
#
# and see tools/synthetic/README.md. A sweep run without it records the
# endpoint as unreachable, which is honest and not a failure of the sweep.
#
# The state of the other two, measured 2026-09-05, recorded because a reader
# comparing a run against this file should not have to rediscover it:
#
#   bio2rdf.org          DNS SERVFAIL from its own authoritative nameservers,
#                        confirmed against 8.8.8.8 and 1.1.1.1. Not a timeout
#                        and not a 500: the name does not resolve at all, so
#                        every metric will read indeterminate until it does.
#
#   ontoexplorer...      /sparql is the single-page app's own route and serves
#                        HTML for every path and method, so it was replaced on
#                        2026-09-05 with the query service the site's OpenAPI
#                        schema names. Two are published, both unsecured while
#                        nearly every other route on that API requires a bearer
#                        token; this is the content one. The other,
#                        /api/v1/sparql over a Fuseki metadata store, answers 0
#                        to every count and is not listed.
#
#                        It is the only LARGE endpoint here: 12,510,532 triples
#                        across 45 named graphs and 204 classes, measured
#                        2026-09-05. That makes it the one that will actually
#                        exercise a budget, and the one an expensive sweep
#                        costs something to run.
#
#                        WHAT AN EXPENSIVE SWEEP COSTS IT, measured the same
#                        day, one class at a time rather than by sweeping:
#
#                          class enumeration            2.9s
#                          a typical class              0.15s
#                          owl:Restriction (1,352,666)  504 at 30s
#                          owl:Class       (1,080,907)  504 at 30s
#                          owl:Restriction, prefix "0"  1.8s
#                          owl:Restriction, prefix "00" 1.8s
#
#                        So the pass would profile about 197 of its 200 classes
#                        in some 30 seconds of their CPU, and spend another 90
#                        holding their gateway open on three that cannot finish
#                        inside its 30 second limit. The prober's own request
#                        budget is also 30s, so those three land in `unreached`,
#                        which is the designed outcome and not a failure.
#
#                        The hash prefix removes the timeout outright, and both
#                        prefixes cost the same 1.8s: the work is the SHA256
#                        scan over every subject, not the few that survive it.
#                        The shortest prefix that fits is therefore the right
#                        one, and this is the endpoint the fallback ladder in
#                        docs/superpowers/specs/2026-08-29-content-profiles-
#                        design.md exists for. That ladder is specified and not
#                        yet built, so today the three big classes are simply
#                        unreached.
endpoint = [
  "http://127.0.0.1:9200/sparql",
  # THIS SERVICE'S OWN ENDPOINT, added 2026-09-26. Second, behind the control,
  # because it is the other one whose right answers we know.
  #
  # A service that measures SPARQL endpoints should be measured by the same
  # instrument, and the public URL rather than an in-cluster address is the
  # point: it is the one a stranger uses, so it exercises the ingress, the TLS
  # and the CORS headers a browser would actually meet. From inside the cluster
  # it travels through the egress-proxy, like any hardcoded public hostname --
  # see ids3/projects/_base/restrict-egress.yaml.
  #
  # The sweep reads it BEFORE restarting the site, so the hourly publish does
  # not make this endpoint measure itself as down. If a restart ever does
  # overlap a sweep, the unavailability recorded is real and belongs on the
  # page.
  "https://sparqlwatch.dev.k8s.semanticscience.org/sparql",
  "https://bio2rdf.org/sparql",
  "https://ontoexplorer.dev.k8s.semanticscience.org/api/v1/sparql/content",
  # The DBpedia Knowledge Graph Catalog's nine endpoints, as they ANSWER --
