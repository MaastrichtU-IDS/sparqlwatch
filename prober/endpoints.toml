# --- services ------------------------------------------------------------
#
# The shape this file is moving to: one record per SERVICE, with the URLs that
# name it. `endpoint` is the only one any sweep asks. See
# docs/superpowers/specs/2026-09-28-service-identity-design.md.

[[service]]
endpoint = "https://sparql.southgreen.fr/sparql"

  # The URL YummyData lists. It answers 406 to every Accept a SPARQL client
  # sends and 200 text/html to */*, so sweeping it published "does not speak
  # the protocol" about a server that does. Kept, never asked: a reader who
  # finds it in a catalogue is brought here instead.
  [[service.invalid]]
  url = "http://sparql.southgreen.fr/"
  source = "yummydata"
  found = "2026-09-27"
  reason = "406 to every SPARQL Accept; the console, not the endpoint"

[[service]]
endpoint = "https://dbpedia.org/sparql"

  [[service.alternative]]
  url = "http://dbpedia.org/sparql"
  note = "answers the same service; kept so the spelling a catalogue lists resolves here"

[[service]]
endpoint = "https://opendata.aragon.es/sparql"

  [[service.alternative]]
  url = "http://opendata.aragon.es/sparql"
  note = "answers the same service; kept so the spelling a catalogue lists resolves here"

[[service]]
endpoint = "https://sparql.uniprot.org/sparql"

  [[service.alternative]]
  url = "http://sparql.uniprot.org"
  note = "answers the same service; kept so the spelling a catalogue lists resolves here"

# --- glygen, removed from the sweep 2026-09-28 ---
#
# `http://sparql.glygen.org:8880/sparql` is not here, and the reason is OURS
# rather than theirs. Both egress proxies in the path -- the cluster's and the
# operator's workstation -- refuse port 8880:
#
#   HTTP/1.1 403 Forbidden
#   X-Squid-Error: ERR_ACCESS_DENIED 0
#
# so no request this project makes has ever reached glygen. It was published as
# `unresponsive` for weeks on the strength of a denial generated on our side of
# the network, which is a false statement about somebody's server.
#
# NOT in registry/exclusions.toml: that file means "somebody asked to be left
# alone", and glygen asked for nothing. Recording it there would put a reason
# in the record that nobody gave.
#
# It stays in registry/lod-cloud.toml, so its name and its url survive. If the
# egress policy ever allows 8880, it comes back by adding one line here.
