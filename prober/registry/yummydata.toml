# The SPARQL endpoints YummyData lists, as YummyData states them.
#
# MACHINE-EXTRACTED, unlike kg-catalog.toml beside it, and that difference is
# the point. This list comes from a JSON export that carries the endpoint url as
# a field, and the urls are right: this is a service that probes them every day
# and would notice. kg-catalog.toml had to be hand-corrected because seven of
# its ten urls did not serve SPARQL, which is a judgement no extraction rule
# makes. Here `seed` is a transcription, so it is written as one.
#
# WHOSE LIST THIS IS. YummyData is the front end of Umakadata, from DBCLS, and
# it publishes an Umaka Score out of 100 and a letter rank A-E for each
# endpoint. NEITHER IS COPIED HERE and neither should be. This project's whole
# position is that a score combining several attributes hides which one is
# wrong -- see docs/design and /docs/metrics -- so importing their ranking
# alongside their list would import the thing this service exists not to do.
# What is taken is the endpoints. What they scored them is recorded once, in
# yummydata.provenance.toml, as a fact about their sweep rather than ours.
#
# A DIFFERENT POPULATION from everything else here, which is why it is worth
# having: DBCLS curates life sciences, and only 6 of these 63 appear anywhere in
# the other 544 endpoints this repository holds. They are also maintained rather
# than dumped -- 42 of the 63 publish a service description, against none of the
# ten in kg-catalog.toml.
#
# NOT A DEVELOPMENT LIST. The default --endpoints is prober/endpoints.toml.
# These are sixty-three strangers' servers; sweeping them is an explicit act.
#
# `title` is the "Name" YummyData gives each endpoint, not something this file
# infers.

