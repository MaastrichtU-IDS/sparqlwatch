# prober/registry/corrections.toml
#
# This project's own word about an endpoint, where no catalogue has one or the
# one it has is wrong. Two kinds live here and both are our claim rather than
# somebody else's record:
#
#   - a URL this project corrected, with the name that follows the fixed URL
#   - a name for an endpoint no catalogue lists at all, which is every endpoint
#     this project operates itself
#
# WHY A SEPARATE FILE. The other registry files are records of what a third
# party published: `lod-cloud.toml` and `yummydata.toml` are written by
# `seed-registry` from their catalogues' own dumps, and editing one would make
# this project's copy disagree with the source it names in the matching
# `.provenance.toml` -- silently, since nothing re-checks a hand edit. A
# correction is our claim, not theirs, so it is kept where it can be read as
# ours.
#
# It is read LAST (see `_registry_load_order` in web/app.py: files the seeded
# and supplement lists do not name are appended in sorted order), so it can
# only fill in a field no catalogue set. That is the right power for this file:
# a corrected URL is an endpoint no catalogue names at all, so nothing is being
# overridden.
#
# `sparql.southgreen.fr`: YummyData lists the bare root over http. That URL
# answers `406` to every Accept a SPARQL client sends -- including
# `application/sparql-results+json` and `+xml` -- and `200 text/html` to `*/*`,
# so the sweep read it as an endpoint that does not speak the protocol. The
# service is at `/sparql` over https and answers in 0.20s. Measured 2026-09-27.
# The title is the one YummyData gives for the endpoint it meant.

[[endpoint]]
url = "https://sparql.southgreen.fr/sparql"
title = "Agronomic Linked Data (AgroLD)"

# The endpoints this project runs. No catalogue lists them, so without an entry
# here a row shows the whole URL -- and `/api/v1/sparql/content` is a route,
# not a name. Short names, because that is what these services are called.

[[endpoint]]
url = "https://sparqlwatch.dev.k8s.semanticscience.org/sparql"
title = "sparqlwatch"

[[endpoint]]
url = "https://ontoexplorer.dev.k8s.semanticscience.org/api/v1/sparql/content"
title = "OntoExplorer"

# Not a correction but an ADDITION, and it is here for the same reason the
# corrections are: it is this project's claim rather than a catalogue's. The
# LOD Cloud dump names this endpoint in `other_download` on a dataset whose
# `sparql` array is empty, and `seed::candidates` reads `sparql[].access_url`
# and nothing else -- deliberately, since a dump's other fields hold dumps,
# example links and documentation pages far more often than endpoints. Of the
# 20 sparql-shaped URLs living only in those fields, this is the one that
# answers. Editing lod-cloud.toml to add it would be overwritten by the next
# re-seed and would fail that file's fixed-point test.

[[endpoint]]
url = "http://rdf.corpora.uni-leipzig.de/sparql"
title = "Open Bantu isiXhosa Lexicon"

# Added at the operator's request, 2026-09-28. An FDP (FAIR Data Point) store,
# named by a person because no catalogue this project seeds lists it.

[[endpoint]]
url = "https://fdp.dcc.sib.swiss/store/fdp/sparql"
title = "SPHN Metadata Catalog"

# Added at the operator's request, 2026-09-29. Named from the FAIR Data Point's
# own `dct:title`, asked of the endpoint itself rather than invented here.

[[endpoint]]
url = "https://sparql.healthdata.nl/repositories/fdp"
title = "Health-RI FAIR Data Point"
