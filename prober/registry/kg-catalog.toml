# The SPARQL endpoints of the DBpedia Knowledge Graph Catalog, as they ACTUALLY
# ANSWER rather than as the catalog declares them.
#
# HAND-WRITTEN, unlike lod-cloud.toml beside it. `seed-registry` cannot produce
# this file: seven of the ten urls the catalog states do not serve SPARQL, and
# the working ones were found by probing candidates, which is a judgement no
# extraction rule makes. Editing this by hand is therefore correct, and nothing
# overwrites it.
#
# Provenance, every verdict and every correction: kg-catalog.provenance.toml
# beside this file, and docs/kg-catalog-endpoints.md.
#
# NOT A DEVELOPMENT LIST. The default --endpoints is prober/endpoints.toml.
# These are nine strangers' servers; sweeping them is an explicit act.
#
# `title` on each entry below is the "Knowledge graph" name
# docs/kg-catalog-endpoints.md gives it, not something this file infers.

# Correct as the catalog declares them.
[[endpoint]]
url = "https://kaiko.getalp.org/sparql"
title = "DBnary"

[[endpoint]]
url = "http://dskg.org/sparql"
title = "DSKG"

[[endpoint]]
url = "https://semrepo.org/sparql"
title = "SemRepo"

# Corrected. The catalog's url answers with an HTML console in every case
# below, so the endpoint reads as unreachable without the correction.
[[endpoint]]
url = "https://sparql.dblp.org/sparql"
title = "DBLP"

[[endpoint]]
url = "https://query.wikidata.org/sparql"
title = "Wikidata"

[[endpoint]]
url = "https://sidekick.bio2vec.net/fuseki/sidekick/query"
title = "SIDEKICK"

[[endpoint]]
url = "https://orkg.org/triplestore"
title = "ORKG"

[[endpoint]]
url = "https://yago-knowledge.org/sparql/qlever"
title = "YAGO"

# MAKG's successor. makg.org refuses the TLS handshake and the project it
# served was superseded; this is the service, under its current name.
[[endpoint]]
url = "https://semopenalex.org/sparql"
title = "SemOpenAlex"

# The tenth, added 2026-09-17, and the only one that did not come from the MOSS
# query: it is in the catalog's own repository (knowledge-graphs/gnd) and was
# not in MOSS's answer on 2026-09-14. Why is not knowable from outside -- the
# entry predates that read by two months and carries the same moss-publish flag
# as every other, so neither recency nor that flag explains it.
#
# Corrected like the five above, and found the same way they were not: the
# declared https://sparql.dnb.de serves a QLever console, and that console's own
# page source names its backend (BASEURL). Guessing at /sparql, /query and
# /sparql/select found nothing, which is how this endpoint was first, wrongly,
# written off as having no protocol url at all.
[[endpoint]]
url = "https://sparql.dnb.de/api/gnd"
title = "Integrated Authority File"
