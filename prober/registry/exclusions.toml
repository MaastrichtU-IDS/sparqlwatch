# Hosts this project does not probe, because somebody asked to be left alone.
#
# NOT generated, unlike everything else in this directory. `seed-registry`
# writes `lod-cloud.toml` and `lod-cloud.provenance.toml` and overwrites a hand
# edit to either; this file is the opposite. The seeder never writes it, never
# reads a flag naming it, and a re-seed leaves it exactly as it is. That is the
# point: deleting a URL from the seeded registry by hand is undone by the next
# re-seed, and an entry here is not.
#
# `registry.rs` compiles this file in with `include_str!` and applies it in
# `load_endpoints` and in the seeder both. So an entry takes effect at the next
# BUILD of the prober, and a deployment already running honours the file it was
# built from until it is rebuilt.
#
# One table per exclusion, both fields required:
#
#   host    the host to leave alone: no scheme, no port, no path. Every URL on
#           that name is dropped, whatever its scheme, port or path. A value
#           carrying `/`, `:` or `@` is a load error rather than an exclusion
#           that quietly matches nothing.
#   reason  why this host is here. "A person asked, 2026-08-25" is a perfectly
#           good reason. A missing or blank one is a load error, so an
#           exclusion cannot be anonymous and somebody reading this file in a
#           year can tell why a host is on it.
#
# Name no person here. This file is public and the reason is copied into a
# warning whenever the rule fires, so a date and the fact that a request was
# made is enough; an address or a name would be published by writing it down.
# The host itself is published by an entry, which is unavoidable: a hashed
# entry could not be checked by the person who asked or diagnosed by anybody.
#
# NOTHING WATCHES A MAILBOX. An exclusion becomes real when a person adds it
# here and commits it. There is no automation between a request and this file.
#
# Two things to do after adding an entry, both of which a test will otherwise
# tell you about. If the host appears in `lod-cloud.toml`, re-seed, or
# `the_shipped_registry_is_a_fixed_point_of_write_then_read` fails because the
# loader no longer reads back what that file holds. If it appears in
# `calibration-sample.toml`, that sample's own count test fails and the sample
# has to be re-cut, because its measured costs then describe a population that
# no longer includes the host.

[[exclusion]]
host = "sparqlwatch-exclusion-worked-example"
reason = "Nobody asked for this one. It is the file's worked example, and it is the one input that proves the rule is wired in: a single-label host is refused by no other rule in registry.rs, so a test that watches this URL disappear can only be passing because this file was read and applied. Keep it, and add real entries beside it."
