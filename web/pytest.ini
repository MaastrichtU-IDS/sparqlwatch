[pytest]
# Application code lives directly under web/ (e.g. load_run.py), with tests
# in web/tests/. Without this, pytest's import mode adds only the test
# file's own directory to sys.path, so `import load_run` fails whenever
# pytest is invoked from outside web/ (for example `pytest web/tests` run
# from the repository root). This makes web/ importable regardless of the
# working directory pytest is started from.
pythonpath = .
