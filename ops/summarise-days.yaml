# Summarise the closed days of the run archive, and report whether each summary
# says what its runs said. WRITES SUMMARIES; DELETES NOTHING.
#
# WHAT IT IS FOR. A day's 23 hourly runs are about 233,000 quads and nothing
# reads them individually once the day is over -- `_daily_series` buckets
# readings by day, and the one per-sweep reader keeps the newest 40 sweeps. A
# summary is about 12 quads per (endpoint, metric, day). This job writes them
# and then checks them, so the question "could these runs be deleted" is
# answered by evidence from the real archive rather than from fixtures.
#
# IT IS NOT THE DELETION. Nothing here removes a run, and nothing reads a
# summary: the site does not know they exist. A non-zero exit means at least one
# day disagreed, which is the result that must stop any later pruning.
#
# THE SITE MUST BE SCALED TO ZERO WHILE THIS RUNS, and that is not optional.
#
# WHAT I GOT WRONG ON 2026-10-02, written out because the mistake is easy to
# repeat and its symptom points somewhere else. The site SERVES from a
# `Store.read_only` handle, which takes no write lock -- so "the site cannot
# block this job" is true and was the whole of my reasoning. It is only half the
# system. The site's INIT container opens the same store READ-WRITE to load new
# runs, and the hourly prober `rollout restart`s the site, so a new init
# container tries for the write lock at the top of every hour.
#
# A job holding that lock does not fail: the SITE fails, with
#
#   OSError: IO error: While lock file: /data/store/sparqlwatch.db/LOCK:
#   Resource temporarily unavailable
#
# and `Init:CrashLoopBackOff`, which reads as a problem with the site rather
# than with whatever is holding the store. It took the deployment down for
# fourteen hours.
#
# `ops/rebuild-current.yaml` carries the same hazard and has got away with it:
# ten minutes usually fits between two hourly restarts. Anything slower does
# not, and "usually" is not a property worth relying on.
#
#   sudo kubectl -n sparqlwatch-dev scale deploy/site --replicas=0
#   sudo kubectl -n sparqlwatch-dev wait --for=delete pod -l app=site --timeout=5m
#   ... run the job, wait for it ...
#   sudo kubectl -n sparqlwatch-dev scale deploy/site --replicas=1
#
# The sweep that lands while the site is down loses nothing: the prober writes
# its run file to the runs volume and the next init container loads it. Measured
# on the way out of that outage -- 488 run files present, 0 to load, nothing
# missing.
#
#
#   sed "s/IMAGE/$(kubectl -n sparqlwatch-dev get deploy site \
#     -o jsonpath='{.spec.template.spec.containers[0].image}' | sed 's/.*:sha-//')/" \
#     ops/summarise-days.yaml \
#     | kubectl -n sparqlwatch-dev create -f -
#   kubectl -n sparqlwatch-dev wait --for=condition=complete job/<name> --timeout=60m
#   kubectl -n sparqlwatch-dev logs job/<name>
#
# To undo it entirely, run the same job with `--drop` appended to the command.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: summarise-days-
spec:
  backoffLimit: 0
  # It walks every run graph of every closed day and queries each one. The
  # rebuild job's full walk took about ten minutes at 389 runs; this does more
  # per run, so the bound is wider.
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: summarise
          # `sha-` is part of the tag the Release workflow pushes, so IMAGE is
          # the bare commit sha. Substituting the full tag here produces
          # `sparqlwatch:sha-sha-...`; substituting a bare sha WITHOUT this
          # prefix produces a tag that does not exist, and the job sits in
          # ImagePullBackOff for an hour saying nothing useful. Both have
          # happened.
          image: ghcr.io/maastrichtu-ids/sparqlwatch:sha-IMAGE
          imagePullPolicy: IfNotPresent
          workingDir: /app/web
          # The store's own path, not the mount: the init container opens
          # /data/store/sparqlwatch.db and this must be the same database.
          #
          # `--keep-days 3` leaves the newest three days raw. `fleet_history`
          # reads the newest 40 sweeps at per-sweep granularity, which is under
          # two days, and a day still being swept is not a closed day.
          command: ["python", "daily.py", "/data/store/sparqlwatch.db", "--keep-days", "3"]
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          volumeMounts:
            - { name: store, mountPath: /data/store }
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: sparqlwatch-store
