# Summarise the closed days of the run archive, and report whether each summary
# says what its runs said. WRITES SUMMARIES; DELETES NOTHING.
#
# WHAT IT IS FOR. A day's 23 hourly runs are about 233,000 quads and nothing
# reads them individually once the day is over -- `_daily_series` buckets
# readings by day, and the one per-sweep reader keeps the newest 40 sweeps. A
# summary is about 12 quads per (endpoint, metric, day). This job writes them
# and then checks them, so the question "could these runs be deleted" is
# answered by evidence from the real archive rather than from fixtures.
#
# IT IS NOT THE DELETION. Nothing here removes a run, and nothing reads a
# summary: the site does not know they exist. A non-zero exit means at least one
# day disagreed, which is the result that must stop any later pruning.
#
# RUN IT IN THE FIRST HALF OF THE HOUR, AND NEVER LET IT SPAN A RESTART.
#
# This job holds the store's WRITE lock. So does the site's init container,
# which opens the store read-write to load new runs every time a site pod
# starts -- and the hourly prober `rollout restart`s the site at about :06. Two
# writers cannot both have it, and the one that loses is the SITE:
#
#   OSError: IO error: While lock file: /data/store/sparqlwatch.db/LOCK:
#   Resource temporarily unavailable
#
# reported as `Init:CrashLoopBackOff`, which reads as a fault in the site rather
# than in whatever is holding the store. On 2026-10-02 a two-hour run of this
# job spanned four hourly restarts and took the deployment down for fourteen
# hours.
#
# SCALING THE SITE TO ZERO DOES NOT WORK HERE, which was my first fix and was
# wrong: ArgoCD tracks this namespace and synced `replicas` back to 1 inside two
# minutes. Suspending the prober CronJob fails the same way, for the same
# reason. A GitOps-managed namespace does not take instructions from kubectl.
#
# What works is the clock. The sweep starts at :00, takes five or six minutes,
# and restarts the site at about :06. Start this job after that restart lands
# and it has fifty minutes of clear air, which is ample now that it takes
# minutes rather than hours.
#
#   kubectl -n sparqlwatch-dev get pods | grep prober-   # the top of the hour is done
#   ... start the job, watch it, read the log ...
#
# PRUNING COMPACTS, and the job's deadline has to allow for it. `DROP GRAPH`
# writes tombstones; RocksDB reclaims nothing until it compacts, and a prune
# that skipped it left the store HEAVIER to scan than it found it -- 411 dropped
# run graphs put the site into an OOM crashloop on 2026-10-03 because every scan
# walked two million tombstones. The compaction took 36 seconds and the startup
# warm went from 29s to 4.8s. `daily.main` now does it as part of the prune.
#
# `activeDeadlineSeconds` below is the guard rail rather than the plan: it is
# shorter than the gap between two restarts, so a job that hangs is killed
# before it can reach one. It was 7200 -- two hours -- which is what let the
# outage happen.
#
# To undo it entirely, run the same job with `--drop` appended to the command.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: summarise-days-
spec:
  backoffLimit: 0
  # SHORTER THAN THE GAP BETWEEN TWO SITE RESTARTS, deliberately. The site is
  # restarted at about :06 every hour; a job that cannot finish inside this
  # window must die rather than still be holding the write lock when the next
  # init container asks for it. Thirty minutes is several times what a full
  # pass needs -- 17 closed days took well under that once the day's readings
  # were read from their own run graphs instead of from the whole archive.
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: summarise
          # `sha-` is part of the tag the Release workflow pushes, so IMAGE is
          # the bare commit sha. Substituting the full tag here produces
          # `sparqlwatch:sha-sha-...`; substituting a bare sha WITHOUT this
          # prefix produces a tag that does not exist, and the job sits in
          # ImagePullBackOff for an hour saying nothing useful. Both have
          # happened.
          image: ghcr.io/maastrichtu-ids/sparqlwatch:sha-IMAGE
          imagePullPolicy: IfNotPresent
          workingDir: /app/web
          # The store's own path, not the mount: the init container opens
          # /data/store/sparqlwatch.db and this must be the same database.
          #
          # `--keep-days 3` leaves the newest three days raw. `fleet_history`
          # reads the newest 40 sweeps at per-sweep granularity, which is under
          # two days, and a day still being swept is not a closed day.
          command: ["python", "daily.py", "/data/store/sparqlwatch.db", "--keep-days", "3"]
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "4Gi" }
          volumeMounts:
            - { name: store, mountPath: /data/store }
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: sparqlwatch-store
